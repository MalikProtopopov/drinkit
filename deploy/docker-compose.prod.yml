# drinkit (juicy) прод-стек (сеть client_network_prod, рядом с другими проектами на сервере).
#
# Архитектура (2 сервиса) — имена СОВПАДАЮТ с тем, на что маршрутит общий nginx:
#   drinkit.mediann.dev / admin.drinkit.mediann.dev -> juicy_frontend (app/ — публичка + админка, Next)
#   .../api                                          -> juicy_api      (FastAPI + SQLite)
#
# Деплой полностью из git: `make restart` (build из исходников на сервере → up → nginx reload).
# Проект compose = `deploy` (как у живого стека), том БД = juicy_api_data (== deploy_juicy_api_data),
# поэтому пересоздание контейнеров переиспользует существующую БД. Секрет/адрес API — в deploy/.env.
services:
  juicy_frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in deploy/.env}"
    image: juicy_frontend:latest
    container_name: juicy_frontend_prod
    restart: unless-stopped
    expose: ["3000"]
    networks: [client_network]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }

  juicy_api:
    build: { context: ../backend, dockerfile: Dockerfile }
    image: juicy_api:latest
    container_name: juicy_api_prod
    restart: unless-stopped
    expose: ["8000"]
    environment:
      DATABASE_URL: sqlite:////data/juicy.db
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in deploy/.env}"
      OTP_DEV_MODE: "false"
    volumes:
      - juicy_api_data:/data
    networks: [client_network]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }

volumes:
  juicy_api_data:

networks:
  client_network:
    name: client_network_prod
    external: true
